name: CI

# Every pull request and every push to main: typecheck, unit tests and a production build on Linux,
# and the full smoke test (real Electron, real MCP server, the UI driven like a user) on Windows.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These steps never launch Electron, so skip the binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: Smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The smoke drives a 1440 x 900 window and refuses a smaller one; the runner's screen is 1024 x 768,
      # which would clamp the window and move every computed click.
      - name: Set the display to 1920 x 1080
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: npm run smoke
        env:
          SMOKE_SHOTS: smoke-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore
