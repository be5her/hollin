name: Release

# A `v*` tag builds the installers on Windows, macOS and Linux and uploads them, with the update feed
# files (`latest*.yml`), to a draft GitHub Release named after the tag; the owner reviews the draft and
# publishes it (docs/release.md). Run by hand (Actions > Release > Run workflow), it only builds: the
# installers are uploaded as workflow artifacts and nothing is published. The smoke test is not run here:
# CI runs it on every push to main.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One run per tag (or branch, by hand); a second run waits rather than cancelling one that may be
# uploading to the release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Version, changelog, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs the project's dependencies and tests, so it gets no write access.
    permissions:
      contents: read
    env:
      # These steps never launch Electron, so skip the binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # The tag on a tag push; empty by hand, where there is no tag to match.
      TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The tag is v<package.json's version> and CHANGELOG.md has that version's section.
      - run: npm run release:check -- ${TAG:+"$TAG"}
      - run: npm run typecheck
      - run: npm test

  draft:
    name: Draft release
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creates the draft release. Installs nothing: scripts/release-check.mjs needs only Node.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/release-check.mjs "$TAG" --notes "$RUNNER_TEMP/notes.md"
      # The three build jobs upload in parallel, and each would create the release if it found none; so the
      # draft is created once, here, with the changelog section as its notes, and electron-builder finds it.
      # A release for the tag that is already published stops the run: the builds would upload into it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          if [ -z "$found" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          elif printf '%s\n' "$found" | grep -q ' false$'; then
            echo "::error::A published release for $TAG exists already (id and draft: $found). Tag a new version instead."
            exit 1
          else
            echo "A draft release for $TAG exists already (id and draft: $found); the builds upload to it."
          fi

  build:
    name: Installers (${{ matrix.os }})
    needs: [check, draft]
    # By hand there is no draft job (skipped): the builds then need the check only. On a tag they need the draft.
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name != 'push' || needs.draft.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Notarization waits for Apple, which can take a while.
    timeout-minutes: 60
    permissions:
      # Uploads the installers to the draft release.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # electron-builder brings its own tools for every target here (NSIS; dmg and zip; AppImage, and fpm with
      # its Ruby for the deb), so nothing is installed on the runners. It reads GITHUB_REPOSITORY for the feed
      # (electron-builder.cjs). A secret that is not set arrives as an empty string: on Windows electron-builder
      # treats an empty WIN_CSC_LINK as unset, on macOS electron-builder.cjs maps an empty CSC_LINK to
      # `identity: null` and an empty APPLE_ID to no notarization (electron-builder alone would take the empty
      # CSC_LINK as a certificate). The build is then unsigned (docs/release.md).
      - name: Package${{ github.event_name == 'push' && ' and upload to the draft release' || '' }}
        shell: bash
        run: npx electron-builder --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows: a code signing certificate (.pfx, base64) and its password.
          WIN_CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # macOS: a Developer ID Application certificate (.p12, base64) and its password, and the Apple
          # account that notarizes.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
      # electron-builder packs the AppImage from `linux-unpacked/resources` while its deb target writes
      # `package-type` into the same folder, in parallel. To electron-updater's `autoUpdater`, which reads
      # `package-type` before APPIMAGE, an AppImage that caught the file is a deb to update through dpkg. The
      # app picks the AppImage updater itself (src/main/updater.ts), but a release must not carry the file
      # either. `--appimage-extract` needs no FUSE. On a tag the files are already on the draft: delete the
      # draft's assets (or the draft) and run again.
      - name: Check the AppImage carries no package-type
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scratch=$(mktemp -d)
          for image in release/*.AppImage; do
            chmod +x "$image"
            (cd "$scratch" && "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null)
            if [ -e "$scratch/squashfs-root/resources/package-type" ]; then
              echo "::error::$image carries resources/package-type ($(cat "$scratch/squashfs-root/resources/package-type")), which belongs to the deb."
              exit 1
            fi
            rm -rf "$scratch/squashfs-root"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
