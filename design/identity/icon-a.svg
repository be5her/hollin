<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Hollin (working name), app icon candidate A: one room.
    A sheet of warm paper with a hairline edge, one ink room with its door open, and the door
    swing in terracotta: the smallest plan that still reads as a room. The rounded square is the
    macOS framing (artwork inside the system margin, tile 64..960, radius 22 % of its side);
    Windows and Linux reuse the artwork on a square tile with 3 % padding (see brand.html).
    Walls are 100 units thick so they are still 1.5 px at 16 px; the hairline vanishes harmlessly.
    Colours: paper #f6f1e8 (--canvas light), hairline #d9cebc, ink #2a2521 (--fg light),
    terracotta #b9552f (--accent light). The icon does not follow the theme.
  -->
  <!-- Paper tile with its hairline edge -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#f6f1e8"/>
  <rect x="70" y="70" width="884" height="884" rx="194" fill="none" stroke="#d9cebc" stroke-width="12"/>
  <!-- Door swing, terracotta: hinge on the inner face of the left wall, leaf 260 long -->
  <path d="M300 660 H560 A260 260 0 0 0 300 400 Z" fill="#b9552f"/>
  <!-- Door leaf, ink -->
  <path d="M300 660 H560" stroke="#2a2521" stroke-width="28" stroke-linecap="butt"/>
  <!-- The room: four ink walls, 100 thick, with the opening in the left wall (y 400..660) -->
  <rect x="200" y="200" width="624" height="100" fill="#2a2521"/>
  <rect x="724" y="200" width="100" height="624" fill="#2a2521"/>
  <rect x="200" y="724" width="624" height="100" fill="#2a2521"/>
  <rect x="200" y="200" width="100" height="200" fill="#2a2521"/>
  <rect x="200" y="660" width="100" height="164" fill="#2a2521"/>
</svg>
