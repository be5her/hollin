<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 691 170" width="691" height="170">
  <!--
    Hollin (working name): the wordmark "Hollin." as outlined paths, so no font is needed to draw
    it (icon, About, installer). The letterforms are a hand-drawn soft serif after Fraunces
    Semibold (opsz 144, SOFT 80, tracking -0.015 em): bracketed serifs, a flag serif on the l, i
    and n, a round tittle, and the full stop in terracotta. Baseline y = 150, cap height 130,
    x-height 94, stem 30. Ink #2a2521 (--fg light) with the dot #b9552f (--accent light); on the
    dark desk recolour to #ebe3d6 and #e07c50. The 2.4 px same-colour stroke with round joins is
    what softens the corners (SOFT); keep it when scaling.
  -->
  <path transform="translate(16 0)" d="M-15 150 L-15 140 Q0 140 0 127 L0 43 Q0 30 -15 30 L-15 20 L45 20 L45 30 Q30 30 30 43 L30 127 Q30 140 45 140 L45 150 Z" fill="#2a2521" stroke="#2a2521" stroke-width="2.4" stroke-linejoin="round"/>
