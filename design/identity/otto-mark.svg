<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Otto's mark: a mulberry rounded tile (radius 22 % of the side) with Otto's room on it, a
    paper-coloured outlined square with the pen, a dot, still on its top-right corner.
    Drawn at 28, 24, 20 and 16 px. No face, no sparkle.
    These are the light-theme values (--ai #8a3f6f, --ai-fg #fbf6ee); in the app the tile is
    var(--ai) and the room and dot var(--ai-fg), so the dark theme gives #d892bd and #1d1a17.
    Geometry at 64: room 28 square at (17, 20), corner radius 2.5, stroke 5; dot radius 7 at the
    room's top-right corner (45, 20).
  -->
  <rect width="64" height="64" rx="14" fill="#8a3f6f"/>
  <rect x="17" y="20" width="28" height="28" rx="2.5" fill="none" stroke="#fbf6ee" stroke-width="5"/>
  <circle cx="45" cy="20" r="7" fill="#fbf6ee"/>
</svg>
